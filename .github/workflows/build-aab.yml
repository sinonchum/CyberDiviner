name: Build Release AAB

on:
  workflow_dispatch:
  push:
    branches: [release/v*]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CYBERDIVINER_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::CYBERDIVINER_KEYSTORE_B64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/cyberdiviner-release.jks
          echo "Keystore decoded ($(wc -c < app/cyberdiviner-release.jks) bytes)"

      - name: Build release AAB
        env:
          CYBERDIVINER_STORE_FILE: cyberdiviner-release.jks
          CYBERDIVINER_STORE_PASSWORD: ${{ secrets.CYBERDIVINER_STORE_PASSWORD }}
          CYBERDIVINER_KEY_ALIAS: ${{ secrets.CYBERDIVINER_KEY_ALIAS }}
          CYBERDIVINER_KEY_PASSWORD: ${{ secrets.CYBERDIVINER_KEY_PASSWORD }}
        run: |
          for name in CYBERDIVINER_STORE_PASSWORD CYBERDIVINER_KEY_ALIAS CYBERDIVINER_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is not set"
              exit 1
            fi
          done
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyberdiviner-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Show version info
        run: |
          echo "AAB files:"
          ls -lh app/build/outputs/bundle/release/
