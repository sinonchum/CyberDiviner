name: Build Release AAB

on:
  workflow_dispatch:
  push:
    branches: [release/v*]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CYBERDIVINER_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/cyberdiviner-release.jks
            echo "Keystore decoded ($(wc -c < app/cyberdiviner-release.jks) bytes)"
          else
            echo "WARNING: CYBERDIVINER_KEYSTORE_B64 secret not set — signing will fail"
          fi

      - name: Build release AAB
        run: |
          # Remove Mac-specific JAVA_HOME from gradle.properties
          sed -i '/org.gradle.java.home/d' gradle.properties
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyberdiviner-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Show version info
        run: |
          echo "AAB files:"
          ls -lh app/build/outputs/bundle/release/
