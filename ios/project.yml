name: CyberDiviner
options:
  bundleIdPrefix: com.cyberdiviner
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

packages:
  CyberDivinerLibs:
    path: .

targets:
  CyberDivinerApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/CyberDivinerApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyberdiviner.CyberDivinerApp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    dependencies:
      - package: CyberDivinerLibs
        products:
          - DesignSystem
          - DivinationCore
          - AI
          - Persistence
          - Oracle
          - Liuyao
          - Tarot
          - Archive
          - Settings
          - ShareKit
